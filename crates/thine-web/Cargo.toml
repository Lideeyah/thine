[package]
name = "thine-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thine's server: the authority view, and the endpoints a browser needs to sign with a real passkey."

[lib]
name = "thine_web"
path = "src/lib.rs"

[[bin]]
name = "thine-web"
path = "src/main.rs"

[dependencies]
thine-core = { path = "../thine-core" }

defuse-wallet-sdk = { workspace = true }
near-kit = { workspace = true }

anyhow = { workspace = true }
bip39 = { workspace = true }
sha2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
defuse-wallet-webauthn = { workspace = true }
http-body-util = "0.1"
near-kit-sandbox = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex-literal = { workspace = true }
tower = { version = "0.5", features = ["util"] }
